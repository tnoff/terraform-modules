name: Scheduled

# Replaces the GitLab weekly pipeline schedule, deactivated in terraform!261.
# Same cron terraform derived for it, so the cadence is unchanged.

on:
  schedule:
    - cron: '24 19 * * 4'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  renovate:
    name: Renovate
    uses: tnoff/github-workflows/.github/workflows/renovate.yml@b7fe686fa774a9624477729a8c3415c7a78f7666
    secrets:
      renovate_token: ${{ secrets.RENOVATE_TOKEN }}

  branch-cleanup:
    name: Branch cleanup
    permissions:
      contents: write
      pull-requests: read
    uses: tnoff/github-workflows/.github/workflows/branch-cleanup.yml@b7fe686fa774a9624477729a8c3415c7a78f7666
    with:
      age_days: 30
      dry_run: false
