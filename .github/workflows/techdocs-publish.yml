name: Publish TechDocs

# Was an inline generate+publish job; migrated to call the reusable workflow
# once a second repo needed the same steps. See tnoff/github-workflows#77
# for the extraction and why it exists at all (short version: the backstage
# backend runs with techdocs.builder: external because it has no Docker, so
# something else has to build and publish -- see docker-apps +
# tnoff/backstage#20).
#
# TECHDOCS_S3_* secrets come from oci/oci.tf's backstage_techdocs_ci_creds --
# a bucket-only identity, separate from the one the backstage pod itself
# uses, wired in by infra/repos.tf's terraform_modules module.

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - '*.md'
      - 'oci/docs/**'
      - 'oci/oke-networking/README.md'
      - 'mkdocs.yml'
      - 'catalog-info.yaml'
      - '.github/workflows/techdocs-publish.yml'

concurrency:
  group: techdocs-publish
  cancel-in-progress: false

# Without this, permissions default to whatever the repo/org falls back to
# (potentially write-all) instead of being pinned explicitly, same reasoning
# as ci.yml's top-level block. This workflow only reads the repo and forwards
# S3 secrets to the reusable callee -- it never needs to write to the repo.
permissions:
  contents: read

jobs:
  publish:
    name: Generate and publish
    uses: tnoff/github-workflows/.github/workflows/techdocs-publish.yml@f6569d2b6f242fb91759fe0ebfa990a99c09585b
    with:
      entity_ref: default/Component/terraform-modules
    secrets:
      techdocs_s3_access_key_id: ${{ secrets.TECHDOCS_S3_ACCESS_KEY_ID }}
      techdocs_s3_secret_access_key: ${{ secrets.TECHDOCS_S3_SECRET_ACCESS_KEY }}
      techdocs_s3_bucket_name: ${{ secrets.TECHDOCS_S3_BUCKET_NAME }}
      techdocs_s3_endpoint: ${{ secrets.TECHDOCS_S3_ENDPOINT }}
      techdocs_s3_region: ${{ secrets.TECHDOCS_S3_REGION }}
